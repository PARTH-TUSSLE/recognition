name: Test Badge Evaluator (Dry-Run)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository to evaluate (e.g. layer5io/sistent, meshery/meshery)"
        required: true
        type: string
      pr_number:
        description: "Merged Pull Request number in the target repository"
        required: true
        type: number

permissions:
  contents: read
  issues: read

jobs:
  test-evaluation:
    name: Dry-Run Historical PR Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recognition repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned SHA

      - name: Collect target PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Evaluating PR #${PR_NUMBER} from external repository: ${TARGET_REPO}..."

          gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}" > .pr-info.json
          gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}/files" --paginate --slurp | jq 'add // []' > .pr-files.json
          gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}/commits" --paginate --slurp | jq 'add // []' > .pr-commits.json
          gh api "repos/${TARGET_REPO}/issues/${PR_NUMBER}/labels" --paginate --slurp | jq 'add // []' > .existing-labels.json

          node -e '
          const fs = require("fs");
          const pr = JSON.parse(fs.readFileSync(".pr-info.json"));
          const files = JSON.parse(fs.readFileSync(".pr-files.json"));
          const commits = JSON.parse(fs.readFileSync(".pr-commits.json"));
          fs.writeFileSync(".pr-metadata.json", JSON.stringify({ pr, files, commits }, null, 2));
          '

      - name: Run award orchestrator in dry-run mode
        env:
          TARGET_REPO: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          node utils/award-orchestrator.js \
            --metadata=".pr-metadata.json" \
            --existing-labels=".existing-labels.json" \
            --repo="${TARGET_REPO}" \
            --out=".evaluation-result.json"

      - name: Publish step summary
        run: |
          node -e '
          const fs = require("fs");
          const res = JSON.parse(fs.readFileSync(".evaluation-result.json"));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, res.summaryMarkdown + "\n");
          '

      - name: Print sanitized dry-run report
        run: |
          echo "=== SANITIZED DRY-RUN EVALUATION REPORT ==="
          cat .evaluation-result.json | jq .
